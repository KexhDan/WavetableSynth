name: Build VST3 (Windows)

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure (CMake + JUCE via FetchContent)
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64

      - name: Build Release
        run: cmake --build build --config Release --parallel

      - name: List artefacts
        shell: pwsh
        run: |
          Get-ChildItem -Recurse build/WavetableSynth_artefacts |
            Select-Object -ExpandProperty FullName

      - name: Upload VST3
        uses: actions/upload-artifact@v4
        with:
          name: WavetableSynth-VST3-Windows
          path: build/WavetableSynth_artefacts/Release/VST3/**
          if-no-files-found: error
